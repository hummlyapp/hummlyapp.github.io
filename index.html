<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hummly</title>
<meta name="description" content="Hummly — a calm home-cleaning helper with Hummi the hummingbird.">
<link rel="icon" href="hummi.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap" rel="stylesheet">
<style>
  :root { --green: #2E9E6E; --text: #16302A; --muted: #4D6359; --bg: #F1F4EA; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 17px/1.6 "Nunito Sans", system-ui, -apple-system, sans-serif;
    text-align: center; padding: 16px; box-sizing: border-box;
  }
  img { width: 120px; height: 120px; }
  h1 { font: 700 40px/1.1 "Bricolage Grotesque", system-ui, sans-serif; margin: 12px 0 8px; }
  p { color: var(--muted); max-width: 420px; margin: 0 auto 24px; }
  a { color: var(--green); font-weight: 700; }
  nav a { margin: 0 10px; }
</style>
</head>
<body>
<main>
  <img src="hummi.svg" alt="Hummi the hummingbird">
  <h1>Hummly</h1>
  <p>A calm home-cleaning helper. Small daily tasks, no guilt, and a garden that blooms with every one you finish.</p>
  <nav>
    <a href="support/">Help</a>
    <a href="privacy/">Privacy Policy</a>
    <a href="mailto:support@hummlyapp.com">Contact</a>
  </nav>
</main>
</body>
</html>
